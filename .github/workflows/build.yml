name: Build & Test Kotlin Project

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.parallel=true"
  GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: false

jobs:
  build:
    name: Build with Gradle
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      checks: write
      pull-requests: write

    strategy:
      matrix:
        java-version: [ '17' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v3

    - name: Make gradlew executable
      run: chmod +x gradlew
      shell: bash

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: wrapper
        arguments: |
          build
          -x test
          --info
          --stacktrace

    - name: Run unit tests
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: wrapper
        arguments: |
          test
          --info
          --stacktrace

    - name: Generate test reports
      if: always()
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: wrapper
        arguments: testReport

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: build/reports/tests/
        retention-days: 30

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: build/libs/
        retention-days: 7

    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: build/test-results/**/*.xml
        check_name: Test Results
        comment_mode: always

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Make gradlew executable
      run: chmod +x gradlew
      shell: bash

    - name: Run linting & style checks
      uses: gradle/gradle-build-action@v3
      continue-on-error: true
      with:
        gradle-version: wrapper
        arguments: lint --info

    - name: Run code analysis
      uses: gradle/gradle-build-action@v3
      continue-on-error: true
      with:
        gradle-version: wrapper
        arguments: detekt --info

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [ build, code-quality ]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        if [[ "${{ needs.build.result }}" == "failure" ]]; then
          echo "❌ Build failed!"
          exit 1
        else
          echo "✅ Build succeeded!"
        fi
